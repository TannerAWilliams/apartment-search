# Deploys the Worker to Cloudflare: automatically after CI passes on main, or by hand (Actions → Deploy → Run workflow).
# Needs the repository secret CLOUDFLARE_API_TOKEN: an API token from the "Edit Cloudflare Workers" template.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # After CI, only a passing run on a push to main deploys, and it deploys the commit CI checked.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Wrangler, Cloudflare's tool that builds and deploys the Worker, runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Builds the web app and deploys. Unattended, Wrangler moves apartments.5thof6.com to this Worker
      # if another Worker holds it.
      # New schema migrations go in before the code that needs them.
      - name: Apply database migrations
        run: node ./node_modules/wrangler/bin/wrangler.js d1 migrations apply apartment-search-observations --remote -c deploy/cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy to Cloudflare
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Email-code sign-in needs BETTER_AUTH_SECRET. It is made once, here, and never printed; later deploys keep it,
      # so sessions survive deploys.
      - name: Create the sign-in secret if it is missing
        run: |
          wrangler="node ./node_modules/wrangler/bin/wrangler.js"
          if ! $wrangler secret list -c deploy/cloudflare/wrangler.jsonc | grep -q '"BETTER_AUTH_SECRET"'; then
            openssl rand -base64 32 | $wrangler secret put BETTER_AUTH_SECRET -c deploy/cloudflare/wrangler.jsonc
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Times the live site as a first-time visitor on a phone sees it (scripts/perf-live.ts). It runs after the
  # deploy, so it cannot stop one; a red run here says production got slow and shows where the time went.
  speed:
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun ./node_modules/playwright/cli.js install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Live site speed
        run: bun run perf:live

# Checks every pull request and every push to main. It needs no secrets and deploys nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Unit tests and coverage
        run: bun run test:coverage
      - name: Build the web app and bundle the Worker
        run: bun run build
      # Wrangler's local server, which runs the Worker in workerd, does not start under Bun
      # (oven-sh/bun#39247), so this one step uses Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # The Worker in Cloudflare's own runtime (workerd), which unit tests under Bun cannot catch.
      - name: Worker routes in workerd
        run: bun run test:workerd
      - name: Install Chromium
        run: bun ./node_modules/playwright/cli.js install --with-deps chromium
      # Ubuntu 24.04 can block the user namespaces Chromium's sandbox needs; allow them rather than turn the sandbox off.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Browser tests
        run: bun ./node_modules/playwright/cli.js test --trace off
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

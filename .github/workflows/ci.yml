# Checks every pull request and every push to main. It needs no secrets and deploys nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Wrangler, Cloudflare's tool that bundles the Worker and runs it locally in workerd, runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      # Async mistakes fail here: a promise nobody waits for, or awaiting in a loop outside the sync (biome.json).
      - run: bun run lint
      - run: bun run typecheck
      - name: Unit tests and coverage
        run: bun run test:coverage
      # The server's main paths against a production-sized inventory, checked against perf/budgets.json
      # (docs/performance.md). A slowdown fails the run, so it never reaches the deploy.
      - name: Speed budgets
        run: bun run perf
      - name: Build the web app and bundle the Worker
        run: bun run build
      # What a first visit downloads and what a new server instance starts with, against their size limits.
      - name: Size budgets
        run: bun run perf:bundle
      # The Worker in Cloudflare's own runtime (workerd), which unit tests under Bun cannot catch.
      - name: Worker routes in workerd
        run: bun run test:workerd
      - name: Install Chromium
        run: bun ./node_modules/playwright/cli.js install --with-deps chromium
      # Ubuntu 24.04 can block the user namespaces Chromium's sandbox needs; allow them rather than turn the sandbox off.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Includes e2e/perf.spec.ts: how many requests a page makes and what it downloads before it shows.
      - name: Browser tests
        run: bun ./node_modules/playwright/cli.js test --trace off
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Walkup · New York City apartments</title>
    <meta name="description" content="New York City apartments from listing sites, brokerages and landlords in one search, with each rent compared with similar apartments and each building graded from city records." />
    <meta name="theme-color" content="#ffffff" />
    <!-- Installable on iPhone and Android; notifications on iPhone need the Home Screen app. The manifest is
         fetched with credentials so a signed-in session carries over. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Apartments" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/walkup.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      /* iPhone zooms into a text box under 16px when it is tapped, and the zoomed page then slides sideways. */
      input, textarea, select { font-size: 16px !important; }
      html, body { overflow-x: hidden; overscroll-behavior-x: none; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Shown at once, before the app's script has loaded; the app replaces it. */
      .boot { display: flex; flex-direction: column; flex: 1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; }
      .boot-bar { height: 56px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #d7d5d3; }
      .boot-brand { color: #773516; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
      .boot-note { margin: 32px auto; color: #5f5b59; font-size: 15px; }
      /* The home page as it is sent (server/home-page.ts): readable at once, and by crawlers that run no script. */
      .boot-home { max-width: 760px; margin: 0 auto; padding: 28px 20px; color: #201e1c; overflow: auto; }
      .boot-home h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.6px; margin: 0 0 12px; }
      .boot-home h2 { font-size: 17px; margin: 22px 0 4px; }
      .boot-home p { font-size: 16px; line-height: 1.5; color: #5f5b59; margin: 0 0 10px; }
      .boot-home a { color: #201e1c; font-weight: 600; }
      /* The dark theme (src/theme.ts), before the app's own styles arrive: the device's, or the one chosen. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) body, :root:not([data-theme="light"]) .boot { background: #121212; }
        :root:not([data-theme="light"]) .boot-bar { border-color: #373432; }
        :root:not([data-theme="light"]) .boot-brand { color: #f8a47e; }
        :root:not([data-theme="light"]) .boot-note { color: #a19d9a; }
      }
      :root[data-theme="dark"] body, :root[data-theme="dark"] .boot { background: #121212; }
      :root[data-theme="dark"] .boot-bar { border-color: #373432; }
      :root[data-theme="dark"] .boot-brand { color: #f8a47e; }
      :root[data-theme="dark"] .boot-note { color: #a19d9a; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .boot-home, :root:not([data-theme="light"]) .boot-home a { color: #f3f1ef; }
        :root:not([data-theme="light"]) .boot-home p { color: #a19d9a; }
      }
      :root[data-theme="dark"] .boot-home, :root[data-theme="dark"] .boot-home a { color: #f3f1ef; }
      :root[data-theme="dark"] .boot-home p { color: #a19d9a; }
    </style>
    <!-- The card pictures and the map are drawn from OpenFreeMap: the connection is opened while the app loads. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- Asks for the settings and the first search while the app's code downloads (web/boot.ts). -->
    <script src="/boot.js" async></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="boot"><div class="boot-bar"><span class="boot-brand">walkup</span></div><p class="boot-note">Loading apartments…</p></div></div>
  </body>
</html>
